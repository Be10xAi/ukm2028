spring.application.name=tech10x.ukm
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
server.port=${HTTP_PLATFORM_PORT:8081}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=dd-MM-yyyy

app.jwt.secret=${JWT_SECRET:5jXOBwylAGfd3c+OoCbVOV6kf5oT2KwRMNbdtqLoqSw=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
#########otp##########
app.otp.length=${OTP_LENGTH:6}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.max.attempt.allow=${MAX_OTP_ALLOW_PER_USER:5}
