spring.application.name=tech10x.ukm
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ukm}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YourNewPassword123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=dd-MM-yyyy

app.jwt.secret=${JWT_SECRET:5jXOBwylAGfd3c+OoCbVOV6kf5oT2KwRMNbdtqLoqSw=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
#########otp##########
app.otp.length=${OTP_LENGTH:6}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.max.attempt.allow=${MAX_OTP_ALLOW_PER_USER:5}
#########encryption##########
# Used by CryptoConverter to encrypt sensitive columns at rest (e.g. Supplier.bankAccountNo).
app.crypto.secret=${CRYPTO_SECRET:hM3v0k+xslZ2yV6QLtGquHT4+F79aynb2p3wYqDsftQ=}

#########property / room module##########
# Comma-separated hosts image & document URLs may point to. In production use your exact storage
# account host (e.g. ukmprod.blob.core.windows.net); "*.blob.core.windows.net" allows ANY Azure account.
app.storage.allowed-hosts=${STORAGE_ALLOWED_HOSTS:*.blob.core.windows.net}
# Loads lazy associations for lists in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
